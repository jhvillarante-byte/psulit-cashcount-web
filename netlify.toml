redirectsOrigin = "config"
plugins = []
headers = []

[build]
publish = "."
publishOrigin = "config"

  [build.environment]
  NODE_VERSION = "22"

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/receipts/*"
to = "/.netlify/functions/api/receipts/:splat"
status = 200
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/"
to = "/log.html"
status = 200
force = true

[[redirects]]
from = "/classic"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]
