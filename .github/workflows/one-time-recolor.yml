name: Run one-time Cash Count recolor

on:
  push:
    branches: [main]

jobs:
  recolor:
    if: contains(github.event.head_commit.message, 'Trigger one-time Cash Count recolor')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy
        run: |
          for i in {1..24}; do
            code="$(curl -sS -o /tmp/recolor.out -w '%{http_code}' 'https://psulit-cashcount.netlify.app/__recolor-cashcount?key=rc-9f3d6b7a2c1e4f8d')"
            if [ "$code" = "200" ]; then
              cat /tmp/recolor.out
              exit 0
            fi
            sleep 10
          done
          echo "Recolor endpoint did not become ready." >&2
          cat /tmp/recolor.out || true
          exit 1

# one-time trigger marker
