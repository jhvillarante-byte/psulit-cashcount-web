name: One-time Solaire cash-count sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify production deploy
        run: sleep 45

      - name: Trigger Solaire backfill
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          url="https://psulit-cashcount.netlify.app/__psulit-sync-solaire-backfill-20260923-1003"
          for attempt in 1 2 3; do
            echo "Sync attempt $attempt"
            body="$(curl -fsSL --max-time 300 "$url")"
            printf '%s\n' "$body"
            if grep -q 'PSC-MURG045X-6356' <<<"$body"; then
              echo "Oct 2 business-day closing found in sync response."
              exit 0
            fi
            sleep 20
          done
          echo "The deployed function did not return the Oct 2 closing reference."
          exit 1

      - name: Remove one-time workflow
        if: steps.sync.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/one-time-solaire-sync.yml
          git commit -m "Remove one-time Solaire sync workflow"
          git push origin main
