<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSulit CTR Alerts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#152033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 12px rgba(16,24,40,.05)}.brand{font-size:23px;font-weight:800}.sub,.muted,.tiny{color:#667085}.sub{font-size:13px}.tiny{font-size:12px}.amount{font-size:28px;font-weight:800;margin:8px 0}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0;font-size:14px}.pill{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800}.pending{background:#fff4d6;color:#8a5a00}.filed{background:#dcfae6;color:#08783f}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;background:#102a43;color:#fff;margin-top:11px}.tab{border:1px solid #dbe2ea;background:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.tab.active{background:#102a43;color:#fff}input,textarea{width:100%;padding:13px;border:1px solid #d8dee8;border-radius:10px;margin:6px 0 11px;font-size:16px;background:#fff}label{font-size:13px;font-weight:700}.tabs{display:flex;gap:8px;margin:13px 0}.hide{display:none}.login{margin-top:14vh}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.notice{padding:11px 13px;border-radius:10px;background:#eef7ff;margin:10px 0;font-size:13px}.error{background:#fff0f0;color:#9f1c1c}.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);padding:20px;align-items:center;justify-content:center;z-index:10}.modal{background:#fff;border-radius:18px;padding:19px;max-width:520px;width:100%;max-height:92vh;overflow:auto}.x{float:right;border:0;background:none;font-size:25px}.proofbox{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px;margin-top:8px}.required{color:#b42318}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login"><div class="card">
    <div class="brand">₱500K CTR Alerts</div><div class="sub">PSulit • Irene filing access</div>
    <input id="pin" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit PIN">
    <button class="btn" onclick="doLogin()">Open Alerts</button><div id="loginerr" class="tiny" style="margin-top:8px"></div>
  </div></div>

  <div id="app" class="hide">
    <div class="header"><div><div class="brand">₱500K CTR Alerts</div><div class="sub">File CTR and attach proof</div></div><button class="tab" onclick="logout()">Logout</button></div>
    <div id="notice"></div>
    <div class="tabs"><button id="tp" class="tab active" onclick="setFilter('PENDING')">Pending <span id="pc"></span></button><button id="tf" class="tab" onclick="setFilter('FILED')">Filed <span id="fc"></span></button></div>
    <div id="list"></div>
  </div>
</div>

<div id="modalbg" class="modalbg"><div class="modal">
  <button class="x" onclick="closeModal()">×</button><h3>File CTR</h3><div id="mref" class="muted"></div>
  <label>CTR Reference / Filing No. <span class="tiny">(optional)</span></label><input id="ctrref" placeholder="Enter reference if available">
  <label>Notes <span class="tiny">(optional)</span></label><textarea id="notes" rows="3" placeholder="Any filing note"></textarea>
  <div class="proofbox"><label>Screenshot of filed CTR <span class="required">* required</span></label>
    <input id="proof" type="file" accept="image/*" required>
    <div class="tiny">Upload the screenshot showing the CTR was successfully filed. Max 6 MB. It will be posted to Telegram as a reply under the original ₱500K alert.</div>
  </div>
  <button id="submitbtn" class="btn" onclick="submitFile()">Mark FILED TO CTR & Post Screenshot</button>
</div></div>

<script>
const API='/.netlify/functions/ctr-proxy';
let pin=sessionStorage.getItem('ctrpin')||'',rows=[],filter='PENDING',current=null;
const el=id=>document.getElementById(id);
async function api(body){body.pin=pin;const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Request failed');return j}
async function doLogin(){pin=el('pin').value.trim();try{await api({action:'login'});sessionStorage.setItem('ctrpin',pin);showApp();await load()}catch(e){el('loginerr').textContent=e.message}}
function showApp(){el('login').classList.add('hide');el('app').classList.remove('hide')}
function logout(){sessionStorage.removeItem('ctrpin');location.reload()}
async function load(){try{const j=await api({action:'list'});rows=j.rows||[];render()}catch(e){notice(e.message,true)}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '₱'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function notice(t,err){el('notice').innerHTML=t?'<div class="notice '+(err?'error':'')+'">'+esc(t)+'</div>':''}
function setFilter(v){filter=v;render()}
function render(){const p=rows.filter(x=>x.status==='PENDING').length,f=rows.filter(x=>x.status==='FILED').length;el('pc').textContent='('+p+')';el('fc').textContent='('+f+')';el('tp').classList.toggle('active',filter==='PENDING');el('tf').classList.toggle('active',filter==='FILED');const data=rows.filter(x=>x.status===filter);el('list').innerHTML=data.length?data.map(card).join(''):'<div class="card muted" style="text-align:center;padding:38px">No '+filter.toLowerCase()+' CTR alerts.</div>'}
function card(x){const txn=[x.transaction_type,Number(x.foreign_amount||0).toLocaleString(),x.currency,x.rate?'@ '+x.rate:''].filter(Boolean).join(' ');let h='<div class="card"><span class="pill '+(x.status==='FILED'?'filed':'pending')+'">'+(x.status==='FILED'?'✓ FILED':'⏳ PENDING')+'</span><div class="amount">'+money(x.php_equivalent)+'</div><div class="row"><b>'+esc(x.reference||'')+'</b><span>'+esc(x.branch||'')+'</span></div><div class="row"><span class="muted">Client</span><span>'+esc(x.client_counterparty||'—')+'</span></div><div class="row"><span class="muted">Transaction</span><span>'+esc(txn)+'</span></div><div class="row"><span class="muted">Teller</span><span>'+esc(x.teller||'—')+'</span></div>';if(x.status==='FILED')h+='<div class="row"><span class="muted">Filed by</span><span>'+esc(x.filed_by||'Irene')+'</span></div><div class="row"><span class="muted">CTR Ref</span><span>'+esc(x.ctr_reference||'—')+'</span></div><div class="row"><span class="muted">Proof</span><span>✓ Screenshot attached</span></div>';else h+='<button class="btn" onclick="openModal('+x.id+')">File CTR & Upload Screenshot</button>';return h+'</div>'}
function openModal(id){current=rows.find(x=>x.id===id);el('mref').textContent=(current.reference||'')+' • '+current.branch+' • '+money(current.php_equivalent);el('ctrref').value='';el('notes').value='';el('proof').value='';el('modalbg').style.display='flex'}
function closeModal(){el('modalbg').style.display='none';current=null}
function fileBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',').pop());r.onerror=rej;r.readAsDataURL(file)})}
async function submitFile(){if(!current)return;const f=el('proof').files[0];if(!f){notice('Please attach the screenshot of the filed CTR first.',true);return}if(!String(f.type||'').startsWith('image/')){notice('Please upload an image screenshot.',true);return}if(f.size>6291456){notice('Screenshot must be 6 MB or smaller.',true);return}const b=el('submitbtn');b.disabled=true;b.textContent='Uploading & posting…';try{const data=await fileBase64(f);const j=await api({action:'file',id:current.id,ctr_reference:el('ctrref').value.trim(),notes:el('notes').value.trim(),proof_name:f.name,proof_type:f.type,proof_base64:data});closeModal();notice(j.warning||'CTR filed. Screenshot posted under the Telegram alert.',false);await load()}catch(e){notice(e.message,true)}finally{b.disabled=false;b.textContent='Mark FILED TO CTR & Post Screenshot'}}
if(pin){showApp();load()}
</script>
</body>
</html>
